name: CI

# The PHP tests, which run headless (Layout, Runtime and the text system with
# fake metrics, no window), and the Bun tests of the npm packages, on Linux.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner's PHP loads Xdebug, which stops a call 512 deep (the Markdown
      # parser's pathological inputs nest deeper) and slows every test: off.
      XDEBUG_MODE: "off"
    steps:
      - uses: actions/checkout@v7
      # The runner's PHP: 8.3 or later, with FFI.
      - name: Check PHP
        run: |
          php -v
          php -m
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("ffi") ? 0 : 1);'
      - name: PHP tests
        run: php -d ffi.enable=1 tests/run.php
      - uses: oven-sh/setup-bun@v2
      # The runtime's tests type-check the module myphp generate writes with tsc, of TypeScript 7 as the web template's.
      - name: Install TypeScript
        run: npm install -g typescript@7
      # myphp-runtime resolves to its sources by tsconfig.json's paths: nothing to install.
      - name: Bun tests
        run: bun test packages src/Plugins
      - name: Platform scripts syntax & permission check
        run: |
          bash -n scripts/*.sh
          ls -l bin/myphp scripts/*.sh
          test -x bin/myphp
          test -x scripts/package-android-apk.sh
          test -x scripts/package-ios-app.sh

  # The Windows backend's ground (tests/testdata/windows_probe.php), on PHP's
  # official x64 build: FFI's callbacks from Win32, COM through vtables,
  # Direct3D 11 of WARP (the runner has no GPU), HLSL, DirectWrite drawing
  # through a renderer of PHP's.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install PHP
        shell: pwsh
        run: |
          $releases = Invoke-RestMethod https://windows.php.net/downloads/releases/releases.json
          $build = $releases.'8.4'.PSObject.Properties | Where-Object { $_.Name -match '^nts-vs\d+-x64$' } | Select-Object -First 1
          $zip = $build.Value.zip.path
          Write-Host "PHP $($releases.'8.4'.version): $zip"
          Invoke-WebRequest "https://windows.php.net/downloads/releases/$zip" -OutFile "$env:RUNNER_TEMP\php.zip"
          Expand-Archive "$env:RUNNER_TEMP\php.zip" -DestinationPath C:\myphp-php
          Set-Content C:\myphp-php\php.ini @(
            'extension_dir="C:\myphp-php\ext"',
            'extension=ffi', 'extension=mbstring', 'extension=intl', 'extension=curl', 'extension=openssl', 'extension=sodium', 'extension=sockets', 'extension=fileinfo',
            'ffi.enable=1', 'memory_limit=-1'
          )
          "C:\myphp-php" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Check PHP
        run: |
          php -v
          php -m
      - name: Windows probe
        run: php tests/testdata/windows_probe.php
      # The suite, as the backend grows, each test in a process of its own: what fails on Windows yet is listed in one annotation, the job not failed by it.
      - name: PHP tests
        continue-on-error: true
        run: php tests/run.php --each
