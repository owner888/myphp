name: CI

# The PHP tests, which run headless (Layout, Runtime and the text system with
# fake metrics, no window), and the Bun tests of the npm packages, on Linux.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The runner's PHP loads Xdebug, which stops a call 512 deep (the Markdown
      # parser's pathological inputs nest deeper) and slows every test: off.
      XDEBUG_MODE: "off"
    steps:
      - uses: actions/checkout@v7
      # The runner's PHP: 8.3 or later, with FFI.
      - name: Check PHP
        run: |
          php -v
          php -m
          php -r 'exit(PHP_VERSION_ID >= 80300 && extension_loaded("ffi") ? 0 : 1);'
      - name: PHP tests
        run: php -d ffi.enable=1 tests/run.php
      - uses: oven-sh/setup-bun@v2
      # myphp-runtime resolves to its sources by tsconfig.json's paths: nothing to install.
      - name: Bun tests
        run: bun test packages src/Plugins
