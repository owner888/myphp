name: Phone Runtimes

# Builds and publishes the prebuilt Android arm64, iOS arm64, and iOS Simulator arm64
# PHP 8.5 embed runtime archives (tag: runtime-php-<version>) so `myphp run` and
# `myphp build` download them in seconds instead of compiling from source; and the
# static PHP of each desktop platform (micro.sfx), which the apps `myphp build`
# makes carry: one of another platform than the building machine's can only be
# downloaded.
on:
  workflow_dispatch:
    inputs:
      php_version:
        description: "PHP version to build"
        default: "8.5.12"
        required: true
      targets:
        description: "What to build"
        type: choice
        options: [all, phones, desktop]
        default: all
  push:
    tags: ["runtime-php-*"]

permissions:
  contents: write

jobs:
  build-runtimes:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets != 'desktop' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MYPHP_PHONE_PHP_VERSION: ${{ inputs.php_version || '8.5.12' }}
      MYPHP_BUILD_FROM_SOURCE: "1"
    steps:
      - uses: actions/checkout@v4
      # The build scripts patch PHP's headers with php, which a developer's machine has (myphp runs on it) and the runner has not.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install build dependencies
        run: brew install autoconf automake libtool pkg-config bison re2c
      - name: Build Android arm64 runtime
        run: ./scripts/build-android-php.sh
      - name: Build iOS arm64 device runtime
        env:
          MYPHP_IOS_SDK: iphoneos
        run: ./scripts/build-ios-php.sh
      - name: Build iOS arm64 simulator runtime
        env:
          MYPHP_IOS_SDK: iphonesimulator
        run: ./scripts/build-ios-php.sh
      - name: Package runtime archives
        run: |
          chmod +x scripts/package-phone-runtimes.sh
          ./scripts/package-phone-runtimes.sh dist-runtimes
      # What a developer's `myphp run -d <iPhone>` has after it downloads an archive: the launcher is compiled against it alone.
      - name: Compile the iOS launcher from each iOS archive alone
        run: |
          for archive in dist-runtimes/myphp-runtime-ios-*.tar.gz; do
            ./scripts/check-ios-runtime-archive.sh "$archive"
          done
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="runtime-php-${MYPHP_PHONE_PHP_VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Prebuilt Phone PHP Runtimes (${MYPHP_PHONE_PHP_VERSION})" --notes "Prebuilt Android arm64, iOS arm64, and iOS Simulator arm64 PHP embed runtimes."
          fi
          gh release upload "$TAG" dist-runtimes/*.tar.gz dist-runtimes/SHA256SUMS --clobber

  # The static PHP of the desktop platforms, each built on a machine of its own system and architecture by
  # `myphp micro`, as a developer's machine builds it, and published under the name `myphp build` asks for.
  micro:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.targets != 'phones' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64 }
          - { runner: macos-15-intel, platform: darwin-amd64 }
          - { runner: ubuntu-24.04, platform: linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MYPHP_PHONE_PHP_VERSION: ${{ inputs.php_version || '8.5.12' }}
      MYPHP_BUILD_FROM_SOURCE: "1"
    steps:
      - uses: actions/checkout@v4
      # The PHP that runs bin/myphp: 8.4 or later, with FFI (the tests' job has the same).
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi, mbstring, curl, openssl, dom, xml, zip, phar
          ini-values: ffi.enable=1
          coverage: none
      - name: Build micro.sfx
        # spc asks GitHub's API for each library's releases: without a token the runner's shared address is refused (403).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php -d ffi.enable=1 bin/myphp micro
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="runtime-php-${MYPHP_PHONE_PHP_VERSION}"
          VERSION="$(php -r 'preg_match("/^const MICRO_PHP = \x27([0-9.]+)\x27/m", file_get_contents("bin/myphp"), $m); echo $m[1];')"
          test -n "$VERSION"
          ASSET="myphp-micro-${{ matrix.platform }}-php-${VERSION}.sfx"
          cp "$HOME/.myphp/micro.sfx" "$ASSET"
          ls -l "$ASSET"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Prebuilt PHP Runtimes (${MYPHP_PHONE_PHP_VERSION})" --notes "Prebuilt PHP runtimes of the phones and static PHP of the desktops." || gh release view "$TAG" >/dev/null
          fi
          gh release upload "$TAG" "$ASSET" --clobber
